name: 安装或转换问题 / Bug report
description: 提交可复现问题，请勿上传敏感文件。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "请使用自制或获授权的脱敏样例，不要上传单位/客户文件、激活码或 API Key。"
  - type: textarea
    id: environment
    attributes:
      label: 系统与版本 / Environment
      description: App 版本、macOS 版本、Apple 芯片型号。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤与预期 / Steps and expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果 / Actual result
      description: 页码、输入类型、本地或在线模式、脱敏错误信息。
    validations:
      required: true
